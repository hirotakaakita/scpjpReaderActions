name: SCP Crawler

on:
  schedule:
    # 毎週日曜日午前0時（UTC）に実行（日本時間午前9時）
    - cron: '0 0 * * 0'
  workflow_dispatch: # 手動実行も可能

concurrency:
  group: scp-crawler
  cancel-in-progress: false

jobs:
  # languages.jsから全言語×全ページのmatrixを生成する
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate matrix
        id: matrix
        run: echo "matrix=$(node print-matrix.js)" >> "$GITHUB_OUTPUT"

  crawl:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 120
    strategy:
      fail-fast: false # 1ページの失敗で他ページのクロールを止めない
      max-parallel: 5 # クロール先のレート制限対策（wikidot全体への同時接続数を制限）
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # local-data/<lang>/scp-data.json（checkout済み）を参照して
      # createdAt・取得済み画像URLを引き継ぐ差分クロール
      # 並列実行のためエントリ間の待機を1000msに延長（レート制限対策）
      - name: Crawl ${{ matrix.lang }}/${{ matrix.page }}
        run: node partial-crawler.js ${{ matrix.lang }} ${{ matrix.page }}
        env:
          CRAWL_DELAY_MS: '1000'

      - name: Upload partial data
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.lang }}--${{ matrix.page }}
          path: partial-data/${{ matrix.lang }}--${{ matrix.page }}.json
          retention-days: 3
          if-no-files-found: error

  # 言語単位で全ページのクロールが成功した言語のみ結合・配備する
  # （ある言語で1ページでも失敗するとその言語はスキップされ、local-dataは前回のまま維持される）
  merge-and-deploy:
    runs-on: ubuntu-latest
    needs: crawl
    if: always() && needs.crawl.result != 'cancelled'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all partial data
        uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partial-data
          merge-multiple: true

      - name: Merge partial data into local-data
        run: node merge-data.js

      - name: Apply manga availability flags
        run: node apply-manga-flags.js

      - name: Configure Git
        run: |
          git config --global user.name 'SCP Crawler Bot'
          git config --global user.email 'scp-crawler@github-actions.bot'

      - name: Commit and push results
        run: |
          git add local-data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SCP data - $(date -u +%Y%m%d%H%M%S)"
            # 実行中に他のrunがデータをpushしていた場合、生成ファイル同士の
            # rebaseは必ず衝突するため、今回のクロール結果（新しい方）を優先する
            git pull --rebase -X theirs origin master
            git push origin master
          fi
