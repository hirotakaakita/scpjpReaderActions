name: SCP Crawler

on:
  schedule:
    # 毎週日曜日午前0時（UTC）に実行（日本時間午前9時）
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_refresh_scp_details:
        description: "Force refresh SCP object classes and excerpts"
        required: false
        default: false
        type: boolean
      force_refresh_object_class:
        description: "Force refresh all SCP object classes"
        required: false
        default: false
        type: boolean
      force_refresh_description:
        description: "Force refresh all SCP description excerpts"
        required: false
        default: false
        type: boolean
      force_refresh_tags:
        description: "Force refresh all SCP tags"
        required: false
        default: false
        type: boolean

concurrency:
  group: scp-crawl
  cancel-in-progress: false
  queue: max

jobs:
  # languages.jsから全言語×全ページのmatrixを生成する
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check public tag filtering
        run: node --test test/public-tags.test.js test/tag-dictionary.test.js test/rufoundation-crawler.test.js test/relations.test.js test/semantic-survey.test.js test/semantic-review-policy.test.js

      - name: Validate deterministic mobile packaging
        run: python3 -m unittest discover -s test -p test_mobile_package.py
      - name: Validate tag dictionary
        run: node -e "require('./tag-dictionary').readDictionary('tag-dictionary.json')"

      - name: Generate matrix
        id: matrix
        run: echo "matrix=$(node print-matrix.js)" >> "$GITHUB_OUTPUT"

  crawl:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 360
    strategy:
      fail-fast: false # 1ページの失敗で他ページのクロールを止めない
      max-parallel: 5 # Wikidot???????????
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # local-data/<lang>/scp-data.json（checkout済み）を参照して
      # createdAt・取得済み画像URLを引き継ぐ差分クロール
      # 並列実行のためエントリ間の待機を1000msに延長（レート制限対策）
      - name: Crawl ${{ matrix.lang }} site
        run: node language-crawler.js ${{ matrix.lang }}
        env:
          CRAWL_DELAY_MS: '1000'
          CRAWL_ENTRY_CONCURRENCY: '2'
          CRAWL_REQUEST_INTERVAL_MS: '500'
          CAPTURE_RELATIONS: '1'
          RELATIONS_CAPTURE_DIR: partial-data/relations/${{ matrix.lang }}
          FORCE_REFRESH_SCP_DETAILS: ${{ inputs.force_refresh_scp_details == true && '1' || '0' }}
          FORCE_REFRESH_OBJECT_CLASS: ${{ inputs.force_refresh_object_class == true && '1' || '0' }}
          FORCE_REFRESH_DESCRIPTION: ${{ inputs.force_refresh_description == true && '1' || '0' }}
          FORCE_REFRESH_TAGS: ${{ inputs.force_refresh_tags == true && '1' || '0' }}

      - name: Upload partial data
        uses: actions/upload-artifact@v7
        with:
          name: partial-${{ matrix.lang }}
          path: partial-data/
          retention-days: 3
          if-no-files-found: error

  # 言語単位で全ページのクロールが成功した言語のみ結合・配備する
  # （ある言語で1ページでも失敗するとその言語はスキップされ、local-dataは前回のまま維持される）
  merge-and-deploy:
    concurrency:
      group: scp-data-update
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    needs: crawl
    if: always() && needs.crawl.result != 'cancelled'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all partial data
        uses: actions/download-artifact@v7
        with:
          pattern: partial-*
          path: partial-data
          merge-multiple: true

      - name: Test localized catalog generation
        run: node --test test/tag-catalog.test.js test/crawler-tag-refresh.test.js test/catalog-identity.test.js test/apply-manga-flags.test.js test/staging-catalogs.test.js test/rufoundation-crawler.test.js test/russian-labels-images.test.js

      - name: Prepare tag dictionary before catalog generation
        run: node prepare-tag-dictionary.js

      - name: Merge partial data into local-data
        run: node merge-data.js

      - name: Apply manga availability flags
        run: node apply-manga-flags.js

      - name: Reject duplicate article IDs before publication
        run: node catalog-identity.js

      # Compare against the latest master acquired after entering the publish lock.
      - name: Prepare notification queue
        run: node prepare-notification-queue.js

      - name: Configure Git
        run: |
          git config --global user.name 'SCP Crawler Bot'
          git config --global user.email 'scp-crawler@github-actions.bot'

      - name: Commit and push results
        run: |
          git add local-data/ tag-dictionary.json tag-translations-pending.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SCP data - $(date -u +%Y%m%d%H%M%S)"
            # Fail on competing writes; never overwrite notification state via rebase.
            git push origin master
          fi

  # Reuse the bodies already fetched above; graph generation is isolated from app catalog publication.
  relation-graph:
    concurrency:
      group: relation-graph
      cancel-in-progress: false
    needs: [crawl, merge-and-deploy]
    if: always() && needs.merge-and-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/relation-snapshots
      - uses: actions/download-artifact@v7
        with:
          pattern: partial-*
          path: partial-data
          merge-multiple: true
      - run: node relations/build.js
      - run: node relations/validate.js
      - run: node relations/preview.js
      - name: Generate and validate mobile research board
        run: |
          node relations/mobile/export_research_board.cjs
          node --test test/mobile-assets.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: research-board-mobile
          path: relations/mobile-output/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: relation-source-records
          path: relations/.cache/records/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: relation-graph
          path: relations/output/
          retention-days: 90
          if-no-files-found: error


  publish-research-board:
    needs: relation-graph
    if: github.ref == 'refs/heads/master' && needs.relation-graph.result == 'success'
    concurrency:
      group: scp-data-update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: research-board-mobile
          path: relations/mobile-output
      - uses: actions/download-artifact@v7
        with:
          name: relation-source-records
          path: relations/.cache/records
      - uses: ./.github/actions/publish-research-board
        with:
          directory: relations/mobile-output
