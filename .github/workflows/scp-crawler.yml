name: SCP Crawler

on:
  schedule:
    # 毎週日曜日午前0時（UTC）に実行（日本時間午前9時）
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_refresh_scp_details:
        description: "Force refresh SCP object classes and excerpts"
        required: false
        default: false
        type: boolean
      force_refresh_object_class:
        description: "Force refresh all SCP object classes"
        required: false
        default: false
        type: boolean
      force_refresh_description:
        description: "Force refresh all SCP description excerpts"
        required: false
        default: false
        type: boolean
      force_refresh_tags:
        description: "Force refresh all SCP tags"
        required: false
        default: false
        type: boolean

concurrency:
  group: scp-crawl
  cancel-in-progress: false
  queue: max

jobs:
  # languages.jsから全言語×全ページのmatrixを生成する
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check public tag filtering
        run: node --test test/public-tags.test.js test/tag-dictionary.test.js test/rufoundation-crawler.test.js

      - name: Validate tag dictionary
        run: node -e "require('./tag-dictionary').readDictionary('tag-dictionary.json')"

      - name: Generate matrix
        id: matrix
        run: echo "matrix=$(node print-matrix.js)" >> "$GITHUB_OUTPUT"

  crawl:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 360
    strategy:
      fail-fast: false # 1ページの失敗で他ページのクロールを止めない
      max-parallel: 5 # Wikidot???????????
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # local-data/<lang>/scp-data.json（checkout済み）を参照して
      # createdAt・取得済み画像URLを引き継ぐ差分クロール
      # 並列実行のためエントリ間の待機を1000msに延長（レート制限対策）
      - name: Crawl ${{ matrix.lang }} site
        run: node language-crawler.js ${{ matrix.lang }}
        env:
          CRAWL_DELAY_MS: '1000'
          CRAWL_ENTRY_CONCURRENCY: '2'
          CRAWL_REQUEST_INTERVAL_MS: '500'
          FORCE_REFRESH_SCP_DETAILS: ${{ inputs.force_refresh_scp_details == true && '1' || '0' }}
          FORCE_REFRESH_OBJECT_CLASS: ${{ inputs.force_refresh_object_class == true && '1' || '0' }}
          FORCE_REFRESH_DESCRIPTION: ${{ inputs.force_refresh_description == true && '1' || '0' }}
          FORCE_REFRESH_TAGS: ${{ inputs.force_refresh_tags == true && '1' || '0' }}

      - name: Upload partial data
        uses: actions/upload-artifact@v5
        with:
          name: partial-${{ matrix.lang }}
          path: partial-data/
          retention-days: 3
          if-no-files-found: error

  # 言語単位で全ページのクロールが成功した言語のみ結合・配備する
  # （ある言語で1ページでも失敗するとその言語はスキップされ、local-dataは前回のまま維持される）
  merge-and-deploy:
    concurrency:
      group: scp-data-update
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    needs: crawl
    if: always() && needs.crawl.result != 'cancelled'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all partial data
        uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partial-data
          merge-multiple: true

      - name: Test localized catalog generation
        run: node --test test/tag-catalog.test.js test/crawler-tag-refresh.test.js test/catalog-identity.test.js

      - name: Prepare tag dictionary before catalog generation
        run: node prepare-tag-dictionary.js

      - name: Merge partial data into local-data
        run: node merge-data.js

      - name: Apply manga availability flags
        run: node apply-manga-flags.js

      - name: Reject duplicate article IDs before publication
        run: node catalog-identity.js

      # Compare against the latest master acquired after entering the publish lock.
      - name: Prepare notification queue
        run: node prepare-notification-queue.js

      - name: Configure Git
        run: |
          git config --global user.name 'SCP Crawler Bot'
          git config --global user.email 'scp-crawler@github-actions.bot'

      - name: Commit and push results
        run: |
          git add local-data/ tag-dictionary.json tag-translations-pending.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SCP data - $(date -u +%Y%m%d%H%M%S)"
            # Fail on competing writes; never overwrite notification state via rebase.
            git push origin master
          fi
