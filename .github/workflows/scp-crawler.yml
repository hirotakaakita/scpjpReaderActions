name: SCP Crawler

on:
  schedule:
    # 毎週日曜日午前0時（UTC）に実行（日本時間午前9時）
    - cron: '0 0 * * 0'
  workflow_dispatch: # 手動実行も可能

concurrency:
  group: scp-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false # 1ページの失敗で他ページのクロールを止めない
      max-parallel: 3 # クロール先のレート制限対策（同時実行を3ページまでに制限）
      matrix:
        page:
          - scp-series
          - scp-series-2
          - scp-series-3
          - scp-series-4
          - scp-series-5
          - scp-series-6
          - scp-series-7
          - scp-series-8
          - scp-series-9
          - joke-scps
          - scp-ex
          - scp-series-jp
          - scp-series-jp-2
          - scp-series-jp-3
          - scp-series-jp-4
          - joke-scps-jp
          - scp-jp-ex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # local-data/scp-data.json（checkout済み）を参照して
      # createdAt・取得済み画像URLを引き継ぐ差分クロール
      # 並列実行のためエントリ間の待機を1000msに延長（レート制限対策）
      - name: Crawl ${{ matrix.page }}
        run: node partial-crawler.js ${{ matrix.page }}
        env:
          CRAWL_DELAY_MS: '1000'

      - name: Upload partial data
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.page }}
          path: partial-data/${{ matrix.page }}.json
          retention-days: 3
          if-no-files-found: error

  # 全ページのクロールが成功した場合のみ結合・配備する
  # （1ページでも失敗するとこのジョブはスキップされ、local-dataは前回のまま維持される）
  merge-and-deploy:
    runs-on: ubuntu-latest
    needs: crawl
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all partial data
        uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partial-data
          merge-multiple: true

      - name: Merge partial data into local-data
        run: node merge-data.js

      - name: Configure Git
        run: |
          git config --global user.name 'SCP Crawler Bot'
          git config --global user.email 'scp-crawler@github-actions.bot'

      - name: Commit and push results
        run: |
          git add local-data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SCP data - $(date -u +%Y%m%d%H%M%S)"
            git pull --rebase origin master
            git push origin master
          fi
