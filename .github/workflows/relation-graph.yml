name: Refresh relation graph
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum pages to fetch (0 = all eligible pages)'
        default: '500'
        required: true
      language:
        description: 'Branch code; empty = all branches'
        default: ''
        required: false
concurrency:
  group: relation-graph
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  relation-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test test/relations.test.js test/semantic-survey.test.js test/semantic-review-policy.test.js
      - uses: ./.github/actions/relation-snapshots
      - name: Refresh source evidence (conditional requests, resumable)
        env:
          RELATION_MAX_PAGES: ${{ inputs.max_pages }}
          RELATION_LANGUAGE: ${{ inputs.language }}
        run: node relations/refresh.js --max-pages "$RELATION_MAX_PAGES" --language "$RELATION_LANGUAGE"
      - name: Validate deterministic mobile packaging
        run: python3 -m unittest discover -s test -p test_mobile_package.py
      - run: node relations/build.js
      - run: node relations/validate.js
      - run: node relations/preview.js
      - name: Generate and validate mobile research board
        run: |
          node relations/mobile/export_research_board.cjs
          node --test test/mobile-assets.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: research-board-mobile
          path: relations/mobile-output/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: relation-source-records
          path: relations/.cache/records/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: relation-graph
          path: relations/output/
          retention-days: 90
          if-no-files-found: error


  publish-research-board:
    needs: relation-graph
    if: github.ref == 'refs/heads/master' && needs.relation-graph.result == 'success'
    concurrency:
      group: scp-data-update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: research-board-mobile
          path: relations/mobile-output
      - uses: actions/download-artifact@v7
        with:
          name: relation-source-records
          path: relations/.cache/records
      - uses: ./.github/actions/publish-research-board
        with:
          directory: relations/mobile-output
