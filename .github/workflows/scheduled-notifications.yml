name: Scheduled SCP Notifications

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      recovery_delivery:
        description: 'Unresolved delivery ID (e.g. jp/2026-10-04); blank for normal sending'
        required: false
        type: string
      recovery_action:
        description: 'sent = suppress resend; retry = authorize possible duplicate'
        type: choice
        options: [sent, retry]
        default: sent
      recovery_reason:
        description: 'Investigation result and reason (required for recovery)'
        required: false
        type: string

jobs:
  send:
    timeout-minutes: 10
    concurrency:
      group: scp-data-update
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Test notification lifecycle
        run: node --test test/notifications.test.js test/notification-messages.test.js test/workflow-concurrency.test.js
      - name: Configure notification checkpoints
        run: |
          git config user.name 'SCP Notification Bot'
          git config user.email 'scp-notifications@github-actions.bot'
      - name: Recover unresolved delivery
        if: inputs.recovery_delivery != ''
        run: node recover-notification.js
        env:
          RECOVERY_DELIVERY: ${{ inputs.recovery_delivery }}
          RECOVERY_ACTION: ${{ inputs.recovery_action }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
      - run: node send-scheduled-notifications.js
        if: inputs.recovery_delivery == ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Preserve recovery evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: notification-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-data/notification-deliveries.json
          if-no-files-found: ignore
          retention-days: 30
