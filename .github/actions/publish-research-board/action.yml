name: Publish immutable research board
inputs:
  directory:
    required: true
    description: Directory containing validated mobile assets
runs:
  using: composite
  steps:
    - name: Package mobile data and durable source observations
      shell: bash
      env:
        MOBILE_DIR: ${{ inputs.directory }}
        GH_REPO: ${{ github.repository }}
      run: python3 relations/mobile/package.py --input "$MOBILE_DIR" --records relations/.cache/records --output relations/release --repo "$GH_REPO"
    - name: Publish immutable release then update pointer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        revision="$(node -p "require('./relations/release/latest.json').revision")"
        tag="research-board-v1-$revision"
        if gh release view "$tag" >/dev/null 2>&1; then
          mkdir -p relations/release-existing
          gh release download "$tag" --pattern research-board-v1.zip --dir relations/release-existing
          cmp relations/release/research-board-v1.zip relations/release-existing/research-board-v1.zip
          gh release download "$tag" --pattern source-records.zip --dir relations/release-existing
          python3 relations/mobile/reuse_source.py
        else
          gh release create "$tag" relations/release/research-board-v1.zip relations/release/source-records.zip --title "Research board $revision" --notes "Automatically generated SCP reference graph. Sources: linked SCP Wiki articles, CC BY-SA 3.0. Story relationships remain source-scoped." --latest=false
        fi
        mkdir -p research-board
        cp relations/release/latest.json research-board/latest.json
        git config user.name 'SCP Crawler Bot'
        git config user.email 'scp-crawler@github-actions.bot'
        git add research-board/latest.json
        if ! git diff --cached --quiet; then
          git commit -m "Update research board $revision"
          git push origin HEAD:master
        fi
